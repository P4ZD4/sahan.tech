version: 1
frontend:
    phases:
        preBuild:
            commands:
                - 'nvm install 22'
                - 'npm install -g pnpm@12.22.0'
                - 'pnpm install'
        build:
            commands:
                - 'pnpm run build'
    artifacts:
        baseDirectory: dist
        files:
            - '**/*'
    cache:
        paths:
            - 'node_modules/**/*'